; PlatformIO Project Configuration
; ILDAWaveX16 - ESP32-S3 Main Controller
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[platformio]
default_envs = ildawavex16

[env:ildawavex16]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = espidf

; CPU frequency
board_build.f_cpu = 240000000L

; Flash settings  
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; Use custom partition table
board_build.partitions = partitions.csv

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    ; --- Diagnostic logging (set to 0 to disable, saves CPU) ---
    -DLOG_DAC_STATS=1       ; ISR stats: pts/s, expected, error_ppm, underruns (Core 1, every 2s)
    -DLOG_RX_METER=1        ; RX meter: pts/s, buffer level, rate (Core 0, every 1s)
    -DLOG_RATE_CHANGE=1     ; Scan rate change notifications (Core 0, each change)
    -DLOG_PERF=1             ; Task profiling: ISR time, refill time, recv/parse time (every 5s)

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; OTA Upload via HTTP (use curl after first upload):
; curl -X POST -F "file=@.pio/build/ildawavex16/firmware.bin" http://192.168.4.1/api/ota
;
; Arduino OTA (alternative, requires espota protocol support):
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags =
;     --port=3232
;     --auth=ildawavex16

; Debug (optional - for JTAG debugging)
; debug_tool = esp-builtin
; debug_init_break = tbreak app_main
