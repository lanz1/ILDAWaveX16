; PlatformIO Project Configuration
; ILDAWaveX16 - ESP32-S3 Main Controller
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[platformio]
default_envs = ildawavex16

[env:ildawavex16]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = espidf

; CPU frequency
board_build.f_cpu = 240000000L

; Flash settings  
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; Use custom partition table
board_build.partitions = partitions.csv

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3

; Debug build flags (disable -Werror to allow ESP-IDF warnings)
debug_build_flags = 
    ${this.build_flags}
    -Wno-error=maybe-uninitialized
    -Og             ; Optimize for debugging (smaller than -O0, still debuggable)
    -ggdb3          ; Maximum debug info

; Debug settings
build_type = debug

; Upload settings
upload_speed = 921600
upload_protocol = esptool

; OTA Upload via HTTP (use curl after first upload):
; curl -X POST -F "file=@.pio/build/ildawavex16/firmware.bin" http://192.168.4.1/api/ota
;
; Arduino OTA (alternative, requires espota protocol support):
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags =
;     --port=3232
;     --auth=ildawavex16

; Debug (JTAG debugging via USB)
debug_tool = esp-builtin
debug_init_break = tbreak app_main
debug_speed = 5000